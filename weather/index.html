<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GPS 坐标十天天气预报图：温度、露点、体感、云量、降水、湿度、气压及风速。"><title>GPS 十天天气预报图</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js?v=20261009-bookmark-title"></script></head>
<body><main>
  <form id="location-form" class="toolbar"><strong>十天天气预报</strong><div class="location-search"><label for="location-input" class="sr-only">地址、邮编或坐标</label><input id="location-input" type="search" placeholder="地址、邮编或坐标，例如 98029 / 47.542, -122.015" autocomplete="off" required aria-describedby="search-help"><button id="search" type="submit">查询</button></div><div class="unit-switch" aria-label="温度单位"><button id="celsius" type="button" aria-pressed="true">°C</button><button id="fahrenheit" type="button" aria-pressed="false">°F</button></div></form>
  <p id="search-help" class="search-help">输入地址、城市、ZIP code、十进制坐标或度分秒；也可粘贴含坐标的地图链接。</p>
  <section id="candidates" class="candidates" hidden aria-label="匹配地点"><div class="candidate-heading"><span>请选择匹配的地点</span><button id="close-candidates" aria-label="关闭地点候选">×</button></div><div id="candidate-list"></div></section>
  <div class="meta"><span id="location-meta"></span><span id="status" role="status" aria-live="polite">正在获取预报…</span></div>
  <section id="weather" hidden aria-label="十日天气图表">
    <div class="time-toolbar"><button id="previous" aria-label="向前一天">‹</button><span id="range-label"></span><button id="next" aria-label="向后一天">›</button><output id="hover-time"></output></div>
    <div class="chart-scroll"><div class="forecast-chart"><div class="daily-grid" id="daily"></div><div id="panels"></div></div></div>
    <div class="inspect"><label for="hour-slider">逐小时查看 <span id="slider-time"></span></label><input id="hour-slider" type="range" min="0" max="239" value="0"></div>
    <div id="readout" class="readout" aria-live="off"></div>
    <p class="notes">灰色背景表示夜间。悬停／触摸曲线可同时查看四组数据，点击图例可隐藏曲线。累计降水从图表起点累计；降水量对应标示时刻之前一小时。降雪概率：当前数据源未提供。</p>
  </section>
  <footer>天气：<a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a> · 地点：<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap</a> / <a href="https://www.geonames.org/" target="_blank" rel="noopener noreferrer">GeoNames</a> · 模型网格预报 · 免费 API 适用于非商业用途<span id="grid-info"></span></footer>
</main></body></html>
